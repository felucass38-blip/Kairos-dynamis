<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://kairos-dynamis.netlify.app/sistemas/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Káiros Dynamis — Demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--s1:#121214;--s2:#19191C;--s3:#222226;--ln:#29292D;--tx:#F2F2EE;--mu:#9A9A94;--mu2:#62625D;--ac:#C6FF3D;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#050506}
body{font:15px/1.45 Inter,system-ui,sans-serif;color:var(--tx);background:#050506;display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
.app{width:100%;max-width:440px;min-height:100vh;background:var(--bg);padding-bottom:calc(160px + env(safe-area-inset-bottom))}
@media(min-width:520px){body{padding-top:28px}.app{min-height:calc(100vh - 28px);border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;overflow:hidden}}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font:600 13px Sora,Inter,system-ui,sans-serif}
.mark{font:700 16px Sora,Inter,system-ui,sans-serif;letter-spacing:-.02em}.mark i{font-style:normal;color:var(--ac)}
.brand small{color:var(--mu2);font:500 12px Inter,system-ui,sans-serif}
.switch{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 14px;border:1px solid var(--ln);border-radius:999px;font-size:13px;font-weight:500;color:var(--tx)}
.switch svg{color:var(--mu)}
.hero{padding:28px 20px 20px}
.eyebrow{color:var(--mu);font-size:13px}
.hero h1{font:600 31px/1.08 Sora,Inter,system-ui,sans-serif;letter-spacing:-.035em;margin-top:8px}
.hero.sm{padding:24px 20px 16px}
.hero.sm h1{font-size:26px;margin:0}
.hero.sm .eyebrow{margin-top:5px}
.hr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.h2{display:flex;justify-content:space-between;align-items:baseline;padding:26px 20px 10px;font:600 11.5px Inter,system-ui,sans-serif;color:var(--mu2);text-transform:uppercase;letter-spacing:.1em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px}
.kpi{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:16px}
.kpi.w{grid-column:1/-1;padding:20px}
.kpi span{display:block;color:var(--mu);font-size:12.5px}
.kpi b{display:block;font:600 24px/1.1 Sora,Inter,system-ui,sans-serif;letter-spacing:-.025em;margin-top:8px}
.kpi.w b{font-size:40px;color:var(--ac);letter-spacing:-.04em}
.kpi em{display:block;font-style:normal;color:var(--mu2);font-size:12px;margin-top:5px}
.list{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px}
.row .g{flex:1;min-width:0}
.row b{display:block;font-weight:500}
.row small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.row .v{font:600 15px Sora,Inter,system-ui,sans-serif;white-space:nowrap}
.row.sel{border-color:var(--mu2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu2);flex:none}
.dot.hot{background:var(--tx)}
.chev{color:var(--mu2);display:flex}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid var(--ln);color:var(--mu);margin-top:7px;margin-right:4px}
.tag.hot{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tag.ac{color:var(--ac);border-color:rgba(198,255,61,.3)}
.chips{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--ln);font-size:13.5px;font-weight:500;color:var(--mu)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip i{font-style:normal;opacity:.55;margin-left:6px}
.search{margin:0 20px 12px;display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:0 14px;color:var(--mu2)}
.search input{flex:1;background:none;border:0;outline:0;padding:13px 0;color:var(--tx);min-width:0}
.search input::placeholder,.in::placeholder{color:var(--mu2)}
.step{display:flex;align-items:center;background:var(--s2);border-radius:10px;flex:none}
.step button{width:36px;height:36px;display:grid;place-items:center;font-size:18px;color:var(--mu)}
.step span{min-width:26px;text-align:center;font:600 14px Sora,Inter,system-ui,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:12px;border:1px solid var(--ln);font-weight:600;text-align:center;margin-top:10px;color:var(--tx)}
.btn svg{flex:none}
.btn.pri{background:var(--ac);color:#0B0B0C;border-color:var(--ac)}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;margin:0;flex:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11.5px;font-weight:500;color:var(--mu2)}
.nav button.on{color:var(--tx)}
.nav button.on svg{color:var(--ac)}
.av{width:38px;height:38px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font:600 13px Sora,Inter,system-ui,sans-serif;color:var(--mu);flex:none}
.empty{color:var(--mu2);font-size:14px;padding:18px 4px}
.foot{color:var(--mu2);font-size:12px;text-align:center;padding:36px 20px 0}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:none}
.sheet-wrap.open{display:block}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;max-height:88vh;overflow:auto;background:var(--s1);border-top:1px solid var(--ln);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 18px}
.sheet h3{font:600 22px/1.2 Sora,Inter,system-ui,sans-serif;letter-spacing:-.025em}
.sheet .sub{color:var(--mu);font-size:14px;margin-top:4px}
.big{font:600 42px/1 Sora,Inter,system-ui,sans-serif;letter-spacing:-.04em;margin:20px 0 4px}
label,.lb{display:block;font-size:12.5px;color:var(--mu);margin:16px 0 6px}
.in{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:13px 14px;outline:0;color:var(--tx)}
.in:focus{border-color:var(--mu2)}
.note{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.lines{margin-top:18px;border-top:1px solid var(--ln)}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:14px;align-items:center}
.line>span:last-child{font-family:Sora,Inter,system-ui,sans-serif;font-weight:500;white-space:nowrap}
.line.t{border-bottom:0}
.line.t span{font:600 18px Sora,Inter,system-ui,sans-serif}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pay3{grid-template-columns:1fr 1fr 1fr}
.pay .btn{margin:0}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 14px;border:1px solid var(--ln);border-radius:12px;font-size:14px}
.opt span:last-child{font-family:Sora,Inter,system-ui,sans-serif;color:var(--mu);display:flex;align-items:center;gap:8px}
.opt.on{border-color:var(--ac)}
.opt.on span:last-child{color:var(--ac)}
.cat{font:600 11.5px Inter,system-ui,sans-serif;color:var(--mu2);text-transform:uppercase;letter-spacing:.1em;margin:20px 0 8px}
.ir{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-bottom:8px}
.ir .lb{margin-bottom:0}
.prog{display:flex;gap:4px;margin:20px 0 8px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--s3)}
.prog i.on{background:var(--ac)}
.progl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:500;width:max-content;max-width:min(400px,calc(100% - 40px));transition:.25s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* mercado */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px}
.pcard{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:116px;position:relative}
.pcard b{font-weight:500;font-size:14px;line-height:1.3;padding-right:22px}
.pcard .pr{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pcard .pr span{font:600 16px Sora,Inter,system-ui,sans-serif}
.pcard .pr small{color:var(--mu2);font-size:12px}
.pcard.in-cart{border-color:var(--mu2)}
.qn{position:absolute;top:10px;right:10px;background:var(--ac);color:#0B0B0C;font:700 12px Sora,Inter,system-ui,sans-serif;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.cartbar{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:416px;display:flex;align-items:center;justify-content:space-between;background:var(--ac);color:#0B0B0C;border-radius:14px;padding:10px 10px 10px 18px;z-index:9}
.cartbar small{display:block;font-size:12px;font-weight:500}
.cartbar b{font:700 19px Sora,Inter,system-ui,sans-serif;letter-spacing:-.02em}
.cartbar button{background:#0B0B0C;color:var(--tx);padding:12px 16px;border-radius:10px;font-weight:600}
/* agenda */
.slots{padding:0 20px}
.slot{display:flex;align-items:stretch;gap:14px;width:100%;padding:5px 0}
.slot time{font:600 13.5px Sora,Inter,system-ui,sans-serif;width:46px;color:var(--mu);flex:none;padding-top:13px}
.slot .card{flex:1;background:var(--s1);border:1px solid var(--ln);border-left:3px solid var(--ac);border-radius:12px;padding:12px 14px}
.slot .card b{display:block;font-weight:500}
.slot .card small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.slot .card.ok,.slot .card.falta{border-left-color:var(--mu2)}
.slot .card.ok b,.slot .card.falta b{color:var(--mu)}
.slot .free{flex:1;border:1px dashed var(--ln);border-radius:12px;padding:12px 14px;color:var(--mu2);font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
/* restaurante */
.mesas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px}
.mesa{aspect-ratio:1/1.08;border-radius:var(--r);padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--ln);background:var(--s1)}
.mesa b{display:block;font:600 26px Sora,Inter,system-ui,sans-serif;letter-spacing:-.03em}
.mesa small{display:block;font-size:12px;color:var(--mu)}
.mesa.livre{background:none;border-style:dashed}
.mesa.livre b{color:var(--mu2)}
.mesa.conta{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.mesa.conta small{color:#4a4a45}
.sw{width:44px;height:26px;border-radius:13px;background:var(--s3);position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mu2);transition:.2s}
.sw.on{background:var(--tx)}.sw.on:after{left:21px;background:var(--bg)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet" class="sheet-wrap"></div>

<script>

chev:'<path d="m9 6 6 6-6 6"/>',

search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'

const AGT=[['inicio','Início','home'],['agenda','Agenda','cal'],['clientes','Clientes','users'],['caixa','Caixa','cash']];
const NICHES={
 mercado:{label:'Mercado',ic:'cart',biz:'Mercadinho Bom Preço',tabs:[['inicio','Início','home'],['pdv','Caixa','cart'],['estoque','Estoque','box'],['fiado','Fiado','wallet']]},

function seedBarb(){return{pro:0,f:'todos',q:'',com:.5,pros:['Rafa','Diego'],
