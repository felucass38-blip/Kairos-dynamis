# Káiros Dynamis · configuração da Netlify
# O site já vem pronto em public/ (gerado por ferramentas/build.py). A Netlify só publica.
[build]
  publish = "public"
  command = "echo Site ja gerado em public"
  # Só o projeto kairos-dynamis publica. Cópias ligadas ao mesmo repositório não gastam créditos.
  ignore = "test \"$SITE_NAME\" != \"kairos-dynamis\""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Arquivos com hash no nome podem ficar em cache por um ano
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/portfolio/soma/site/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"

# Endereços do site antigo que podem estar salvos ou no Google
[[redirects]]
  from = "/planos"
  to = "/sites/"
  status = 301
[[redirects]]
  from = "/planos.html"
  to = "/sites/"
  status = 301
[[redirects]]
  from = "/midias"
